services:
  db:
    image: mysql:8.4
    container_name: carta-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carta
      MYSQL_USER: carta
      MYSQL_PASSWORD: carta
    ports:
      - "3306:3306"
    volumes:
      - carta_mysqldata:/var/lib/mysql
    command: ["--default-authentication-plugin=caching_sha2_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucarta", "-pcarta"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  carta_mysqldata:
